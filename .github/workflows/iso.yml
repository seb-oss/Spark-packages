name: ISO

# Regenerates the ISO packages from their published sources. If anything changed, the
# update is pushed to a branch, checked with the PR workflow, fast-forwarded onto main
# and released. No PR: one opened with GITHUB_TOKEN gets runs that wait for approval.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: iso
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update specifications
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download ISO 10383 (MIC)
        run: curl -fsSL -o packages/iso-10383/src/lib/specifications/iso10383.csv https://www.iso20022.org/sites/default/files/ISO10383_MIC/ISO10383_MIC.csv

      - name: Download ISO 4217 (currencies)
        run: curl -fsSL -o packages/iso-4217/src/lib/specifications/iso4217.xml https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml

      - name: Generate code
        run: |
          yarn workspace @sebspark/iso-10383 generate
          yarn workspace @sebspark/iso-4217 generate
          yarn format

      - name: Push update branch
        id: push
        run: |
          changed=()
          for pkg in iso-10383 iso-4217; do
            if [ -n "$(git status --porcelain "packages/$pkg")" ]; then
              changed+=("$pkg")
            fi
          done
          if [ ${#changed[@]} -eq 0 ]; then
            echo "No changes"
            exit 0
          fi

          branch="iso/update-$(date +%F)"
          {
            echo "---"
            for pkg in "${changed[@]}"; do echo "\"@sebspark/$pkg\": minor"; done
            echo "---"
            echo
            echo "Update ISO specifications"
          } > .changeset/iso-update.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .changeset packages/iso-10383 packages/iso-4217
          git commit -m "feat: update ISO specifications"
          git push --force -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: update
    if: needs.update.outputs.branch != ''
    uses: ./.github/workflows/pr_check.yml
    with:
      ref: ${{ needs.update.outputs.branch }}
    # Nested jobs may not request more than the caller grants, including PR's automerge job
    permissions:
      actions: write
      contents: write
      pull-requests: write

  merge:
    name: Merge and release
    needs: [update, checks]
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.sha }}

      # Fast-forward only, so main gets exactly the checked commit. If main moved
      # meanwhile, this fails and next week's run starts over from the new main.
      - name: Fast-forward main
        env:
          SHA: ${{ needs.update.outputs.sha }}
          BRANCH: ${{ needs.update.outputs.branch }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "$SHA:refs/heads/$MAIN"
          git push origin --delete "$BRANCH"

      # Pushes made with GITHUB_TOKEN don't trigger workflows
      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ github.event.repository.default_branch }}" --repo "$GITHUB_REPOSITORY"
