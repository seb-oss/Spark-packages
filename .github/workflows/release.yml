name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel previously running workflows
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Check licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run license check
        run: node tools/check-licenses.mjs

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check linting, formatting, and imports
        run: yarn biome ci

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run type checking
        run: yarn typecheck

  changeset:
    name: Create Release Pull Request or Publish to NPM
    needs:
      - licenses
      - lint
      - test
      - typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # IMPORTANT: this action's major version is tied to a specific @changesets/cli
      # major version (v1.x -> cli v2.x, v2.x -> cli v3.x). It self-validates the
      # installed CLI version and will fail fast on a mismatch, but always bump the
      # action tag and root package.json's "@changesets/cli" together, never separately.
      - name: Create Changeset PR
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: yarn version-packages
          publish-script: yarn release
          commit-message: "chore(release): update versions"
          pr-title: "chore(release): update versions"

      - name: Report release outcome
        run: |
          echo "### Release outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changesets found: ${{ steps.changesets.outputs.has-changesets }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: ${{ steps.changesets.outputs.published }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "- Packages: ${{ steps.changesets.outputs.published-packages }}" >> "$GITHUB_STEP_SUMMARY"
          fi
