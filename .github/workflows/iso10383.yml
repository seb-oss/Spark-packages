name: ISO10383

on:
  schedule:
    # https://www.iso20022.org/market-identifier-codes
    # These are scheduled one day _after_ the publication date
    - cron: "0 10 14 OCT *" # 2025-10-14
    - cron: "0 10 11 NOV *" # 2025-11-11
    - cron: "0 10 09 DEC *" # 2025-12-09
  workflow_dispatch:

concurrency:
  group: iso10383
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-csv:
    name: Update CSV
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Download dependencies
        run: yarn install --immutable

      - name: Download CSV
        run: |
          cd packages/iso-10383
          curl -o src/lib/specifications/iso10383.csv https://www.iso20022.org/sites/default/files/ISO10383_MIC/ISO10383_MIC.csv
          yarn generate

      - name: Create changeset
        run: |
          cat <<EOF > .changeset/update-iso10383-specifications.md
          ---
          '@sebspark/iso-10383': minor
          ---
            
          Update ISO10383 specifications.
          EOF

      - name: Format generated code
        run: yarn format

      - name: Push changes
        env:
          CI_COMMIT_MESSAGE: "chore: update ISO-10383 specifications"
          CI_COMMIT_AUTHOR: 📈 ISO10383 Bot
        run: |
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "username@users.noreply.github.com"
          git add .
          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push

      # Pushes made with GITHUB_TOKEN do not trigger workflows, but workflow_dispatch does
      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref ${{ github.event.repository.default_branch }}

